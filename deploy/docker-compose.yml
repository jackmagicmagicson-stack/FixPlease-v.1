services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fixplease
      POSTGRES_PASSWORD: fixplease
      POSTGRES_DB: fixplease
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixplease"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgres://fixplease:fixplease@db:5432/fixplease
      BIND_ADDR: 0.0.0.0:8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ATTACHMENTS_DIR: /data/attachments
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin}
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  pgdata:
  attachments:
