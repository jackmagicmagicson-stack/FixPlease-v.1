name: Build

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixplease
          POSTGRES_PASSWORD: fixplease
          POSTGRES_DB: fixplease
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit and DB tests
        run: cargo test -p fixplease-api
        env:
          DATABASE_URL: postgres://fixplease:fixplease@localhost:5432/fixplease
      - name: Start API for integration tests
        run: |
          cargo build --release -p fixplease-api
          ./target/release/fixplease-api &
          echo $! > api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "API ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/health
        env:
          DATABASE_URL: postgres://fixplease:fixplease@localhost:5432/fixplease
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          BOOTSTRAP_ADMIN_PASSWORD: ci-admin
      - name: Smoke test
        run: bash scripts/smoke_test.sh 50
        env:
          TEST_API_URL: http://127.0.0.1:8080
      - name: WebSocket delivery test
        run: cargo test -p fixplease-api --test ws_delivery -- --ignored
        env:
          DATABASE_URL: postgres://fixplease:fixplease@localhost:5432/fixplease
          TEST_API_URL: http://127.0.0.1:8080
      - name: Stop API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate updater signing key (CI)
        run: npx tauri signer generate --ci -p "" -w fixplease-ci.key -f
        working-directory: apps/desktop
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - name: Build Windows installer (PR — no release)
        if: github.event_name == 'pull_request'
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
        working-directory: apps/desktop
      - name: Build and publish release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: app-v__VERSION__
          releaseName: FixPlease v__VERSION__
          releaseBody: |
            Windows-установщик FixPlease.

            1. Скачайте `.msi` или `.exe` (NSIS) из assets ниже.
            2. Установите на рабочие места.
            3. В **Настройках** (кабинет администратора) укажите адрес сервера: `https://<IP-сервера-в-LAN>`.
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
