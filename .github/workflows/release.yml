name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (must already exist on origin)"
        required: true
        default: "v2.0.2"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
        working-directory: apps/desktop

      - run: npm run build
        working-directory: apps/desktop

      - name: Build signed Windows installers
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build
        working-directory: apps/desktop

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          $roots = @(
            Join-Path $env:GITHUB_WORKSPACE "target\release\bundle"
            Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\bundle"
          )
          $found = @()
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            $found += Get-ChildItem (Join-Path $root "nsis\*-setup.exe") -ErrorAction SilentlyContinue
            $found += Get-ChildItem (Join-Path $root "nsis\*-setup.exe.sig") -ErrorAction SilentlyContinue
            $found += Get-ChildItem (Join-Path $root "msi\*.msi") -ErrorAction SilentlyContinue
            $found += Get-ChildItem (Join-Path $root "msi\*.msi.sig") -ErrorAction SilentlyContinue
          }
          if ($found.Count -eq 0) {
            Write-Error "No installer artifacts found under target/**/bundle"
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "target") -Recurse -Include *.msi,*.msi.sig,*-setup.exe,*-setup.exe.sig -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            exit 1
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $found | ForEach-Object {
            Copy-Item $_.FullName release-assets/
            Write-Host "Asset:" $_.FullName
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: FixPlease ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            Windows-установщик FixPlease.

            1. Скачайте **`*-setup.exe`** (NSIS) — рекомендуется: автоматически ставит корневой CA.
            2. Альтернатива: `.msi`.
            3. Адрес сервера (`https://192.168.0.173:8443`) уже встроен в установщик — менять не нужно.
            4. Для автообновления: в админ-настройках укажите версию, URL `*-setup.exe` и содержимое `.sig`.
          files: release-assets/*
